<div class="my-2 todo-item">
    <h4 [ngClass]="{ 'text-decoration-line-through' : !todo.active }">{{todo.title}}</h4>
    <p [ngClass]="{ 'text-decoration-line-through' : !todo.active }">{{todo.desc}}</p>
  
    <input class="form-check-input" type="checkbox" id="todo{{i}}" (click)="onCheckBoxClick(todo)" [checked]='!todo.active'>
    <label class="form-check-label" for="todo{{i}}">
      Done
    </label>
    <button class="btn btn-sm btn-danger" (click)="onClick(todo)">Delete</button>
  </div>
