<div class="my-2">
<h6 >{{todo.sno}}.{{todo.title}}</h6>
<p >{{todo.desc}}</p>

<input class="form-check-input" type="checkbox" value="" id="todo{{i}}"  (click)="onCheckBoxClick(todo)" [checked]='!todo.active'>
<label class="form-check-label" for="todo{{i}}">

  Done
</label>
<button class="btn btn-sm btn-danger" (click)="onClick()" >Delete</button>
</div>
<!-- [ngClass]="{'strike':!todo.active}" -->
