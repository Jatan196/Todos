<div class="my-2">
<div [ngClass]=" { 'text-decoration-line-through' : !todo.active }" >{{todo.sno}}  .  {{todo.title}}</div>
<p  [ngClass]=" { 'text-decoration-line-through' : !todo.active }">{{todo.desc}}</p>

<input class="form-check-input" type="checkbox" value="" id="todo{{i}}"  (click)="onCheckBoxClick(todo)" [checked]='!todo.active'>
<label class="form-check-label" for="todo{{i}}">
Done
</label>
<button class="btn btn-sm btn-danger" (click)="onClick(todo)" >Delete</button>

</div>
